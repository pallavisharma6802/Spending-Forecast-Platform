services:

  # ── Hadoop / HDFS ──────────────────────────────────────────────────────────
  namenode:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
      - "8020:8020"
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    env_file:
      - ./config
    networks:
      - hadoopnet

  datanode:
    image: apache/hadoop:3
    platform: linux/amd64
    command: ["hdfs", "datanode"]
    env_file:
      - ./config
    networks:
      - hadoopnet

  resourcemanager:
    image: apache/hadoop:3
    platform: linux/amd64
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"
    env_file:
      - ./config
    networks:
      - hadoopnet

  nodemanager:
    image: apache/hadoop:3
    platform: linux/amd64
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config
    networks:
      - hadoopnet

  # ── Spark ──────────────────────────────────────────────────────────────────
  spark:
    image: apache/spark:3.5.0
    hostname: spark
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - hadoopnet

  # ── Hive ───────────────────────────────────────────────────────────────────
  hive:
    image: apache/hive:3.1.3
    platform: linux/amd64
    depends_on:
      - namenode
    ports:
      - "10000:10000"
      - "10002:10002"
    environment:
      SERVICE_NAME: hiveserver2
    networks:
      - hadoopnet

  # ── Airflow metadata database ──────────────────────────────────────────────
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    networks:
      - hadoopnet

  # ── Airflow initialisation (runs once) ─────────────────────────────────────
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark:7077
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create
          --username admin --password admin
          --firstname Admin --lastname User
          --role Admin --email admin@fintech.local
      "
    networks:
      - hadoopnet

  # ── Airflow webserver  (UI at http://localhost:8085) ───────────────────────
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - postgres
      - airflow-init
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark:7077
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/tmp/scripts
    command: webserver
    networks:
      - hadoopnet

  # ── Airflow scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark:7077
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/tmp/scripts
    command: scheduler
    networks:
      - hadoopnet

  # ── FastAPI serving layer  (http://localhost:8000) ─────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    depends_on:
      - namenode
    ports:
      - "8000:8000"
    networks:
      - hadoopnet

  # ── Streamlit dashboard  (http://localhost:8501) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8501:8501"
    networks:
      - hadoopnet

networks:
  hadoopnet:

volumes:
  postgres_data:
