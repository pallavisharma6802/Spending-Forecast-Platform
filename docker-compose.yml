services:

  # ── Kafka-compatible broker (local pipeline only; deployed app instead
  #     points at a managed broker - Upstash Kafka / Confluent Cloud) ────────
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    container_name: kafka
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"
    networks:
      - fintechnet

  # ── FastAPI serving layer (http://localhost:8000) ──────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    platform: linux/amd64
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    ports:
      - "8000:8000"
    networks:
      - fintechnet

  # ── Always-on rolling-window consumer (the closer-to-production version of
  #     the same background thread the deployed Dash app runs) ───────────────
  stream-consumer:
    build:
      context: .
      dockerfile: api/Dockerfile
    platform: linux/amd64
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    command: ["python", "scripts/06_stream_consumer.py"]
    networks:
      - fintechnet

  # ── Dash dashboard (http://localhost:8501) ─────────────────────────────────
  dash:
    build:
      context: .
      dockerfile: dash_app/Dockerfile
    platform: linux/amd64
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: "8501"
    ports:
      - "8501:8501"
    networks:
      - fintechnet

networks:
  fintechnet:
